# Recovery for the conservative dual-P5 depth candidate. Relative to the
# original baseline this structure is 14.7% faster while preserving every
# P3/P4 block and all prediction towers.
pruned_weights: outputs/kernel_depth/litepsa_c2f_p4d1_p5zero_head96_folded_init.pt
teacher_weights: vehicle_pose_runs_backbone_neck/carfusion_yolov10n_litepsa_c2f_p4d1_kd_adaptive_60e_r3/weights/best.pt
# Use the versioned dataset descriptor by default. Change only its `path`
# field (or point `data` at a copied runtime YAML) when data lives elsewhere.
data: ultralytics/cfg/datasets/CarFusion-pose.yaml
project: vehicle_pose_runs_kernel_depth
name: litepsa_c2f_p4d1_p5zero_kd_gate12e

epochs: 12
