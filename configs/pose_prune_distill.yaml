# Independent structural-pruning + distillation experiment. Baseline artifacts are never overwritten.
pruned_weights: outputs/pruning/yolov10n_pose_pruned_init.pt
teacher_weights: outputs/baseline_weights/best.pt
data: reports/training/runtime_configs/CarFusion-pose.yaml
project: vehicle_pose_runs_pruned
name: carfusion_yolov10n_prune15_kd_640

# Start conservatively. Escalate only after parameter, latency and accuracy gates pass.
epochs: 20
batch: 16
imgsz: 640
teacher_imgsz: 640
distill_weight: 0.25
temperature: 2.0
detection_distill_weight: 1.0
pose_distill_weight: 1.0
device: 0
workers: 8
seed: 0
fraction: 1.0

# Low-learning-rate recovery from the converged baseline.
optimizer: SGD
lr0: 0.0002
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 1.0

# Preserve keypoint semantics and avoid aggressive augmentation during recovery.
mosaic: 0.0
translate: 0.05
scale: 0.2
fliplr: 0.0
