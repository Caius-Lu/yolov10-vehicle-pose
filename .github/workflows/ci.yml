name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest && pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Run tests
        run: pytest tests/test_vehicle_pose.py tests/test_carfusion_pipeline.py tests/test_vehicle_pose_metrics.py tests/test_benchmark_tools.py tests/test_pose_pruning_distillation.py tests/test_pose_pruning_pipeline.py -q --disable-warnings
